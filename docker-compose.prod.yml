# Production stack for a single VPS. `docker-compose.yml` stays the development
# file and is not used here.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# What differs from development, and why each one matters, is in
# docs/PRODUCTION-DEPLOYMENT.md.

name: portfolio

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    # No published port. The backend reaches it on the internal network and
    # nothing else has any business doing so.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in .env.production}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env.production}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-portfolio}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set in .env.production}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env.production}
    volumes:
      - mongo-data:/data/db
      # Runs once, on an empty data directory, to create the least-privilege
      # application user. Re-running compose does not re-run it.
      - ./scripts/mongo-init-user.js:/docker-entrypoint-initdb.d/init-user.js:ro
    networks:
      - portfolio-network
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--username',
          '${MONGO_ROOT_USERNAME}',
          '--password',
          '${MONGO_ROOT_PASSWORD}',
          '--authenticationDatabase',
          'admin',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    deploy:
      resources:
        limits:
          memory: 1g

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      # One proxy in front. Never `true`: see config/env.ts.
      TRUST_PROXY: '1'
    # Published on the loopback interface only, for a reverse proxy that runs
    # on the host rather than in this stack. Nothing off the machine can reach
    # it: `127.0.0.1` in a published port is the bind address, not a hint.
    ports:
      - '127.0.0.1:${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}'
    volumes:
      - uploads-data:/app/backend/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - portfolio-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.BACKEND_PORT || 5000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        # Baked into the browser bundle at build time, so they are arguments
        # rather than runtime environment.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set in .env.production}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set in .env.production}
        # Baked too, though it does not look it: the `/uploads` rewrite is
        # resolved at build and frozen into the standalone server. Set only
        # below, it stays `localhost:5000` and no uploaded image renders.
        INTERNAL_API_URL: http://backend:${BACKEND_PORT:-5000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side fetches from this container reach the backend by its
      # service name; `localhost` here is this container.
      INTERNAL_API_URL: http://backend:${BACKEND_PORT:-5000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/robots.txt').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 768m

  # The edge, for a machine that has no proxy of its own. It terminates TLS,
  # serves `/uploads` from the volume instead of through Node, and is the single
  # hop `TRUST_PROXY: 1` refers to.
  #
  # Behind a profile, so `up -d` does not start it: a host that already runs
  # Caddy or nginx on 80 and 443 cannot give those ports to a container as well,
  # and the answer there is `scripts/Caddyfile.host` rather than a second edge.
  # Start it with `--profile bundled-proxy` when this stack is the whole server.
  proxy:
    image: caddy:2-alpine
    profiles:
      - bundled-proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set in .env.production}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env.production}
      BACKEND_PORT: ${BACKEND_PORT:-5000}
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates outlive the container, or every restart asks Let's Encrypt
      # for new ones and hits the rate limit.
      - caddy-data:/data
      - caddy-config:/config
      - uploads-data:/srv/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-network
    logging: *logging

volumes:
  mongo-data:
  uploads-data:
  caddy-data:
  caddy-config:

networks:
  portfolio-network:
    driver: bridge
